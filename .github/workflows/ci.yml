name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # x86_64. The suite has also been run on Ubuntu 26.04 aarch64 (see
    # README, "Running the tests"); GitHub's ARM runners aren't used here.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # Ubuntu 23.10+ restricts unprivileged user namespaces, which
      # Chromium's sandbox needs; runners can't install the setuid helper.
      HYBRID_NO_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl xz-utils bzip2 python3 cmake g++ make pkg-config binutils \
            libx11-dev libwebkit2gtk-4.1-dev libjson-glib-dev libsoup-3.0-dev \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 \
            libdbus-1-3 libcups2t64 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libxkbcommon0 libcairo2 libpango-1.0-0 libasound2t64 libgbm1 libdrm2 \
            libgtk-3-0t64 libx11-xcb1 libxtst6 libdbus-glib-1-2 \
            xvfb xauth fonts-dejavu-core python3-xlib python3-pytest python3-pil

      - name: Cache downloads (Firefox, CEF, test add-ons)
        uses: actions/cache@v4
        with:
          path: third_party
          key: third-party-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('versions.json') }}

      - name: Download pinned builds and build the engine hosts
        run: |
          ./setup.sh
          python3 scripts/deps.py fetch-test-addons

      - name: Engine protocol, downloads and repository tests
        run: >
          xvfb-run -a -s "-screen 0 1280x1024x24"
          python3 -m pytest -v -rs tests/test_engine_protocol.py tests/test_deps.py tests/test_repo.py

      - name: Browser tests (Marionette)
        run: >
          xvfb-run -a -s "-screen 0 1280x1024x24"
          python3 -m pytest -v -rs tests/test_browser.py

      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: tests/artifacts/
          if-no-files-found: ignore
