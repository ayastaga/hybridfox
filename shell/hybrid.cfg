// Hybrid browser bootstrap (Firefox autoconfig). The first line must be a comment.
//
// Firefox runs this privileged file at startup. It waits for each browser
// window to finish starting and loads the hybrid layer (hybrid-browser.js)
// into it. It does nothing unless launched through the `hybrid` launcher.
(function () {
  const report = msg => {
    try { console.error("[hybrid] " + msg); } catch (e) {}
    try { dump("[hybrid] " + msg + "\n"); } catch (e) {}
  };
  try {
    const Svc = globalThis.Services ||
      ChromeUtils.importESModule("resource://gre/modules/Services.sys.mjs").Services;
    const root = Svc.env.get("HYBRID_ROOT");
    if (!root) return;
    const file = Components.classes["@mozilla.org/file/local;1"]
      .createInstance(Components.interfaces.nsIFile);
    file.initWithPath(root);
    file.append("shell");
    // Privileged scripts can't load from file:// URLs, so expose the shell
    // folder as resource://hybrid/.
    Svc.io.getProtocolHandler("resource")
      .QueryInterface(Components.interfaces.nsIResProtocolHandler)
      .setSubstitution("hybrid", Svc.io.newFileURI(file));
    const scriptURL = "resource://hybrid/hybrid-browser.js";
    Svc.obs.addObserver({
      observe(win) {
        try {
          if (win.location.href !== "chrome://browser/content/browser.xhtml") return;
          Svc.scriptloader.loadSubScript(scriptURL, win);
        } catch (e) {
          report("failed to load hybrid-browser.js: " + e + "\n" + (e.stack || ""));
        }
      },
    }, "browser-delayed-startup-finished");
    report("bootstrap ready, layer at " + scriptURL);
  } catch (e) {
    report("bootstrap error: " + e + "\n" + (e.stack || ""));
  }
})();
